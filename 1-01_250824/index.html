<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EscapeRoom</title>
      <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-VHD0QPH39L"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-VHD0QPH39L');
  </script>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
  --active: #007bff;
  --success: #28a745;
  --danger: #dc3545;
  --hint: #17a2b8;
  --bg: #f0f2f5;
  --card-bg: #ffffff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  margin: 0;
  padding: 15px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* 성명 입력 모달 오버레이 */
#name-overlay {
  position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9);
  backdrop-filter: blur(8px); z-index: 30000; display: flex;
  justify-content: center; align-items: center; padding: 20px;
}
.name-card {
  background: #fff; padding: 30px; border-radius: 24px;
  max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 25px rgba(0,0,0,0.2);
}

.container-fixed {
  width: 100%;
  max-width: 800px;
  background: var(--card-bg);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  margin-bottom: 20px;
}

/* 헤더 타이틀 및 성명 배지 영역 */
.header-title-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

h1 { 
  margin: 0; 
  font-size: clamp(18px, 4.5vw, 28px);
  font-weight: 800; 
}

.header-user-badge {
  background: #e0e7ff;
  color: #3730a3;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
  border: 1px solid #c7d2fe;
}
.header-user-badge:hover {
  background: #c7d2fe;
}

.quiz-question {
  font-size: clamp(18px, 4vw, 28px);
  font-weight: 700;
  text-align: center;
  margin-bottom: 15px;
  color: #444;
  word-break: keep-all;
}

.stage-button-container {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  width: 100%;
}

.stage-button {
  width: 100%;
  padding: 12px 2px;
  border-radius: 10px;
  border: 1px solid #e9ecef;
  background: #f8f9fa;
  font-size: clamp(12px, 2.5vw, 18px);
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stage-button.active { background: var(--active); color: #fff; border-color: var(--active); }
.stage-button.stage-success { background: var(--success); color: #fff; border-color: var(--success); }

.status-bar { 
  display: flex; 
  justify-content: space-between;
  align-items: center;
  margin-top: 15px; 
  gap: 8px; 
  flex-wrap: wrap;
}

.user-tag { font-size: 14px; font-weight: bold; color: #495057; }

.badge { 
  padding: 6px 12px; 
  border-radius: 20px; 
  font-size: clamp(12px, 3vw, 16px); 
  font-weight: 700; 
  border: 1px solid; 
}
.wrong-badge { background: #fff5f5; color: var(--danger); border-color: #ffe3e3; }
.hint-badge { background: #e7faff; color: var(--hint); border-color: #bee5eb; display: none; }

.quiz-image { 
  width: 100%; 
  max-height: 50vh; 
  border-radius: 12px; 
  display: block; 
  margin: 0 auto; 
  cursor: pointer;
  background: #eee;
  object-fit: contain;
}

.input-group { 
  margin: 20px 0; 
  display: flex; 
  justify-content: center; 
  gap: 10px; 
}
#answer { 
  flex: 1; 
  max-width: 180px; 
  font-size: 18px; 
  padding: 12px; 
  border-radius: 12px; 
  border: 2px solid #dee2e6; 
  text-align: center; 
  appearance: none; 
}

.btn-submit {
  padding: 12px 24px; 
  border-radius: 12px; 
  background: var(--active);
  color: #fff; 
  border: none; 
  font-size: 18px; 
  font-weight: 700; 
  cursor: pointer;
}

.btn-hint {
  padding: 10px 15px; 
  border-radius: 8px; 
  border: 1.5px solid #dee2e6;
  background: #fff; 
  font-size: 14px; 
  margin: 3px; 
  cursor: pointer;
}
.btn-hint.enabled { background: #e7f1ff; border-color: var(--active); color: var(--active); font-weight: bold; }

.hint-content {
  background: #f8f9fa; 
  padding: 15px; 
  border-radius: 12px;
  margin-top: 15px; 
  font-size: 16px; 
  border-left: 4px solid var(--active);
  line-height: 1.5;
}

.success-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 10000;
  padding: 20px;
}
.success-modal { 
  background: #fff; 
  padding: 30px; 
  border-radius: 20px; 
  text-align: center; 
  width: 100%; 
  max-width: 350px; 
}

#final-success {
  position: fixed; inset: 0; background: #fff; z-index: 11000;
  display: flex; justify-content: center; align-items: center; cursor: pointer;
}
#final-success img { width: 100%; height: 100%; object-fit: contain; }

@media (min-width: 800px) {
  .container-fixed { padding: 35px; }
  .stage-button { padding: 18px 5px; font-size: 18px; }
  #answer { font-size: 24px; max-width: 250px; }
  .btn-submit { font-size: 22px; }
}
</style>
</head>
<body>

<!-- 접속용 성명 입력 창 -->
<div id="name-overlay">
  <div class="name-card">
    <h2 style="margin:0 0 10px; font-size: 22px;">입장 확인</h2>
    <p style="font-size: 14px; color: #64748b; margin-bottom: 20px;">성명 또는 코드를 입력해주세요.</p>
    <input type="text" id="user-name-input" placeholder="성명 입력" style="width:100%; padding: 14px; border-radius:12px; border:2px solid #cbd5e1; text-align:center; font-size:18px; font-weight:bold; margin-bottom:15px; outline:none;">
    <button onclick="handleLogin()" class="btn-submit" style="width:100%;">확인</button>
  </div>
</div>

<!-- 본래 방탈출 레이아웃 -->
<div id="main-game" style="width:100%; max-width:800px; display:none;">
  <div class="container-fixed">
    <div class="header-title-bar">
      <h1>EscapeRoom - 250824</h1>
      <!-- 오른쪽에 표시되는 성명 및 로그아웃 버튼 -->
      <div id="header-user-tag" onclick="openLogoutModal()" class="header-user-badge" title="클릭하여 로그아웃">
        👤 <span id="header-student-name">-</span>
        <span style="font-size: 11px; opacity: 0.75; margin-left:2px;">(로그아웃)</span>
      </div>
    </div>
    
    <div id="stage-buttons" class="stage-button-container"></div>
    <div class="status-bar">
      <div id="user-display" class="user-tag">학생: -</div>
      <div style="display:flex; gap:8px;">
        <div id="hint-count-badge" class="badge hint-badge">힌트 횟수: <span id="total-hint-count">0</span></div>
        <div class="badge wrong-badge">오답 횟수: <span id="wrong-count">0</span></div>
      </div>
    </div>
  </div>

  <div id="puzzle" class="container-fixed"></div>
</div>

<script>
// Supabase 설정
const SUPABASE_URL = 'https://whhmnutvzyqsnbffohqj.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndoaG1udXR2enlxc25iZmZvaHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4NTQ2OTYsImV4cCI6MjEwMjQzMDY5Nn0.yMVCwhuiJs_rtuf51zQty3yJfNXMHF2Oauy8y08_2Gc';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

document.addEventListener("contextmenu", e => e.preventDefault());

const puzzleData = [
  {stage:1, question:"?는 무엇일까요?", image:"p1.png", answer:"2", inputType:"number", hints:[{type:'text',content:'개수'},{type:'text',content:'동그라미 개수'}]},
  {stage:2, question:"?는 무엇일까요?", image:"p2.png", answer:["228","229"], inputType:"number", hints:[{type:'text',content:'달력'},{type:'text',content:'2월은?'}]},
  {stage:3, question:"?는 무엇일까요?", image:"p3.png", answer:"85", inputType:"number", hints:[{type:'text',content:'제곱'},{type:'text',content:'더하기'}]},
  {stage:4, question:"?는 무엇일까요?", image:"p4.png", answer:"18", inputType:"number", hints:[{type:'text',content:'제곱'},{type:'text',content:'거꾸로'}]},
  {stage:5, question:"ABCDE는 무엇일까요? (5자리 숫자)", image:"p5.png", answer:"42857", inputType:"number", hints:[{type:'text',content:'E=7'},{type:'text',content:'D=5'}]},
  {stage:6, question:"숫자 4자리를 찾으세요.", image:"p6.png", answer:"5104", inputType:"number", hints:[{type:'image',content:'h6.png'},{type:'text',content:'소수만 읽어라'}]},
  {stage:7, question:"의미하는 단어를 입력하세요.", image:"p7.png", answer:"매듭", inputType:"text", hints:[{type:'text',content:'2글자 단어'},{type:'text',content:'빨강+파랑=보라'}]},
  {stage:8, question:"?는 무엇일까요?", image:"p8.png", answer:"8", inputType:"number", hints:[{type:'image',content:'h8.png'}]},
  {stage:9, question:"?는 무엇일까요?", image:"p9.png", answer:"39", inputType:"number", hints:[{type:'text',content:'3이 2번'},{type:'text',content:'3×12=36'}]},
  {stage:10, question:"?는 무엇일까요?", image:"p10.png", answer:"10000", inputType:"number", hints:[{type:'text',content:'1은 -'},{type:'text',content:'10은 +'},{type:'text',content:'한글로'}]}
];

let studentName = "";
let currentStage = 1;
let totalWrongCount = 0;
let imageZoomOverlay = null;
let clearedStages = new Set();
let hintUsage = {};
let stageWrongCount = {};
let visitedStages = new Set([1]);
let stageState = {};
let sessionStartTime = null;

// --- 10분 세션 관리 유틸리티 ---
const SESSION_KEY_NAME = 'escaperoom_student_name';
const SESSION_KEY_TIME = 'escaperoom_login_time';
const TEN_MINUTES_MS = 10 * 60 * 1000; // 10분(밀리초)

function saveSession(name) {
  localStorage.setItem(SESSION_KEY_NAME, name);
  localStorage.setItem(SESSION_KEY_TIME, Date.now().toString());
}

function clearSession() {
  localStorage.removeItem(SESSION_KEY_NAME);
  localStorage.removeItem(SESSION_KEY_TIME);
}

// 게임 상태 완벽 초기화 함수 (새로운 사용자 로그인/로그아웃 시 호출)
function resetGameState() {
  currentStage = 1;
  totalWrongCount = 0;
  clearedStages = new Set();
  hintUsage = {};
  stageWrongCount = {};
  visitedStages = new Set([1]);
  stageState = {};
  sessionStartTime = null;
}

function checkAutoLogin() {
  const savedName = localStorage.getItem(SESSION_KEY_NAME);
  const savedTime = localStorage.getItem(SESSION_KEY_TIME);

  if (savedName && savedTime) {
    const elapsed = Date.now() - parseInt(savedTime, 10);
    if (elapsed < TEN_MINUTES_MS) {
      studentName = savedName;
      updateUserDisplay();
      loadProgressFromDB();
      $("#name-overlay").hide();
      $("#main-game").show();
      syncProgressWithDB(true);
      return true;
    } else {
      clearSession(); // 10분 경과 시 만료 처리
    }
  }
  return false;
}

function updateUserDisplay() {
  $("#user-display").text(`학생: ${studentName}`);
  $("#header-student-name").text(studentName);
}

// 로그인 핸들러
async function handleLogin() {
  const input = $("#user-name-input").val().trim();
  if (!input) {
    alert("성명을 입력해 주세요.");
    return;
  }

  if (input === "58009859" || input === "관리자") {
    window.location.href = "dashboard.html";
    return;
  }

  studentName = input;
  saveSession(studentName); // 10분 유지 세션 저장
  updateUserDisplay();

  // 로그인 시 이전 기기 메모리 정보 초기화
  resetGameState();
  sessionStartTime = new Date().toISOString(); // 신규 로그인 시간 생성

  await loadProgressFromDB();

  $("#name-overlay").fadeOut(300, () => {
    $("#main-game").fadeIn(300);
  });

  syncProgressWithDB(true);
}

// 로그아웃 모달 및 처리
function openLogoutModal() {
  const modal = $(`
    <div class="success-overlay" id="logoutOverlay">
      <div class="success-modal" style="border-top: 5px solid #6366f1;">
        <h3 style="margin-top:0; color:#1e293b; font-size:20px;">로그아웃</h3>
        <p style="font-size:15px; color:#64748b; margin: 15px 0;">
          <b>${studentName}</b> 학생 계정에서 로그아웃하고<br>새로운 성명으로 입력하시겠습니까?
        </p>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button id="cancelLogoutBtn" class="btn-submit" style="background:#94a3b8; flex:1; padding:10px 0; font-size:16px;">취소</button>
          <button id="confirmLogoutBtn" class="btn-submit" style="background:#6366f1; flex:1; padding:10px 0; font-size:16px;">로그아웃</button>
        </div>
      </div>
    </div>
  `);
  $("body").append(modal);

  $("#cancelLogoutBtn").click(() => $("#logoutOverlay").remove());
  $("#confirmLogoutBtn").click(executeLogout);
}

// 로그아웃 실행
async function executeLogout() {
  if (studentName) {
    // 대시보드에 접속 해제(is_online: false) 및 종료 시간 기록
    await syncProgressWithDB(false);
  }

  // 세션 및 메모리 상태 초기화
  clearSession();
  studentName = "";
  resetGameState();

  // UI 화면 전환
  $("#logoutOverlay").remove();
  $("#main-game").fadeOut(300, () => {
    $("#user-name-input").val('');
    $("#name-overlay").fadeIn(300);
  });
}

$('#user-name-input').on('keypress', function(e) {
  if (e.which === 13) handleLogin();
});

// DB 기록 불러오기
async function loadProgressFromDB() {
  if (!studentName) return;

  const { data, error } = await _supabase
    .from('e101')
    .select('*')
    .eq('student_name', studentName)
    .maybeSingle();

  if (error) {
    console.error("DB 로드 실패:", error);
    return;
  }

  if (data) {
    currentStage = data.current_stage || 1;
    totalWrongCount = data.total_wrong_count || 0;
    
    // DB에 기존 start_time이 저장되어 있다면 사용, 없으면 현재 시간 적용
    sessionStartTime = data.start_time || sessionStartTime || new Date().toISOString();

    if (data.hint_usage) Object.assign(hintUsage, data.hint_usage);
    if (data.stage_wrong_count) Object.assign(stageWrongCount, data.stage_wrong_count);

    if (Array.isArray(data.cleared_stages)) {
      data.cleared_stages.forEach(s => clearedStages.add(s));
    }
    if (Array.isArray(data.stage_views)) {
      data.stage_views.forEach(s => visitedStages.add(s));
    }
    visitedStages.add(currentStage);
  } else if (!sessionStartTime) {
    sessionStartTime = new Date().toISOString();
  }

  updateStatusBar();
  renderStageButtons();
  loadPuzzle(currentStage);
}

// DB 진행도 및 접속시간 업데이트
async function syncProgressWithDB(isOnline = true) {
  if (!studentName) return;

  if (!sessionStartTime) {
    sessionStartTime = new Date().toISOString();
  }

  const payload = {
    student_name: studentName,
    current_stage: currentStage,
    hint_usage: hintUsage,
    total_wrong_count: totalWrongCount,
    stage_wrong_count: stageWrongCount,
    stage_views: Array.from(visitedStages),
    cleared_stages: Array.from(clearedStages),
    is_online: isOnline,
    start_time: sessionStartTime,
    updated_at: new Date().toISOString()
  };

  // 접속 종료 시 ended_at 기록
  if (!isOnline) {
    payload.ended_at = new Date().toISOString();
  }

  const { error } = await _supabase
    .from('e101')
    .upsert(payload, { onConflict: 'student_name' });

  if (error) console.error("DB 업데이트 실패 상세:", error.message, error.details, error.hint);
}

// 브라우저/탭 닫기 감지 시 자동 종료 시간 등록
window.addEventListener("pagehide", () => {
  if (studentName) {
    const url = `${SUPABASE_URL}/rest/v1/e101`;
    const payload = {
      student_name: studentName,
      is_online: false,
      ended_at: new Date().toISOString(),
      updated_at: new Date().toISOString()
    };
    fetch(url, {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify(payload),
      keepalive: true
    });
  }
});

function updateStatusBar() {
  const totalHints = Object.values(hintUsage).reduce((acc, curr) => acc + curr, 0);
  if (totalHints > 0) {
    $("#hint-count-badge").css("display", "inline-block");
    $("#total-hint-count").text(totalHints);
  } else {
    $("#hint-count-badge").hide();
  }
  $("#wrong-count").text(totalWrongCount);
}

function renderStageButtons() {
  const c = $("#stage-buttons").empty();
  puzzleData.forEach(p => {
    const h = hintUsage[p.stage] || 0;
    const label = h > 0 ? `${p.stage}단계(${h})` : `${p.stage}단계`;
    let cls = "stage-button";
    if (p.stage === currentStage) cls += " active";
    else if (clearedStages.has(p.stage)) cls += " stage-success";
    c.append(`<button class="${cls}" onclick="selectStage(${p.stage})">${label}</button>`);
  });
}

function loadPuzzle(stage) {
  const p = puzzleData.find(x => x.stage === stage);
  const saved = stageState[stage] || {};
  let hintBtns = "", hintDivs = "";

  p.hints.forEach((h, i) => {
    const used = (hintUsage[stage] || 0) >= i + 1;
    const enabled = i === 0 || (hintUsage[stage] || 0) >= i;
    hintBtns += `<button class="btn-hint ${enabled ? "enabled" : ""}" ${enabled ? "" : "disabled"} onclick="toggleHint(${i + 1})">힌트 ${i + 1}</button>`;
    if (used) {
      const content = h.type === "text" ? h.content : `<img src="${h.content}" class="quiz-image" style="min-height:auto; margin-top:10px;"
             onclick="toggleImageZoom(this.src)">`;
      hintDivs += `<div class="hint-content">${content}</div>`;
    }
  });

  $("#puzzle").html(`
    <div class="quiz-question">${p.question}</div>
    <img src="${p.image}" class="quiz-image" onclick="toggleImageZoom(this.src)" onerror="this.alt='이미지 없음 (${p.image})'">
    <div class="input-group">
      <input id="answer" type="${p.inputType}" value="${saved.answer || ""}" placeholder="정답" onkeypress="if(event.keyCode==13) checkAnswer()">
      <button class="btn-submit" onclick="checkAnswer()">확인</button>
    </div>
    <p id="result" style="font-weight:700; height:25px; margin:10px 0; font-size:18px; text-align:center;"></p>
    <div style="border-top:1.5px solid #eee; padding-top:20px; margin-top:15px;">${hintBtns}</div>
    ${hintDivs}
  `);
}

function checkAnswer() {
  const p = puzzleData.find(x => x.stage === currentStage);
  const v = $("#answer").val().trim();
  const ok = Array.isArray(p.answer) ? p.answer.includes(v) : v === p.answer;

  if (ok) {
    stageState[currentStage] = { answer: v, result: "정답!" };
    clearedStages.add(currentStage);
    renderStageButtons();
    syncProgressWithDB(true);
    showSuccess();
  } else {
    totalWrongCount++;
    stageWrongCount[currentStage] = (stageWrongCount[currentStage] || 0) + 1;
    updateStatusBar();
    syncProgressWithDB(true);
    showFailure();
  }
}

function showFailure() {
  const modal = $(`
    <div class="success-overlay" id="failureOverlay">
      <div class="success-modal" style="border-top: 5px solid var(--danger);">
        <h2 style="color:var(--danger); margin-top:0;">❌ 틀렸습니다!</h2>
        <p style="font-size:18px;">다시 한번 생각해보세요.</p>
        <button id="modalCloseBtn" class="btn-submit" style="width:100%; margin-top:20px; background:var(--danger);">다시 시도</button>
      </div>
    </div>
  `);
  $("body").append(modal);

  const closeModal = () => {
    $("#failureOverlay").remove();
    $(document).off("keydown", handleFailureEnter);
    $("#answer").focus().select();
  };

  const handleFailureEnter = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      closeModal();
    }
  };

  $(document).on("keydown", handleFailureEnter);
  $("#modalCloseBtn").click(closeModal);
}

function showSuccess() {
  const modal = $(`
    <div class="success-overlay">
      <div class="success-modal" style="border-top: 5px solid var(--success);">
        <h2 style="color:var(--success); margin-top:0;">🎉 정답!</h2>
        <p style="font-size:18px;">참 잘하셨습니다!</p>
        <button id="modalNextBtn" class="btn-submit" style="width:100%; margin-top:20px; background:var(--success);">다음 단계로</button>
      </div>
    </div>
  `);
  $("body").append(modal);

  const closeAndNext = () => {
    $(".success-overlay").remove();
    nextAction();
    $(document).off("keydown", handleEnter);
  };

  const handleEnter = (e) => { if (e.key === "Enter") closeAndNext(); };
  $(document).on("keydown", handleEnter);
  $("#modalNextBtn").click(closeAndNext);
}

function nextAction() {
  if (clearedStages.size === puzzleData.length) {
    showFinalSuccess();
    return;
  }
  let nextStage = -1;
  for (let i = currentStage + 1; i <= puzzleData.length; i++) {
    if (!clearedStages.has(i)) { nextStage = i; break; }
  }
  if (nextStage === -1) {
    for (let i = 1; i <= puzzleData.length; i++) {
      if (!clearedStages.has(i)) { nextStage = i; break; }
    }
  }
  if (nextStage !== -1) selectStage(nextStage);
}

function showFinalSuccess() {
  const finalLayer = $(`
    <div id="final-success">
      <img src="success.png" alt="Clear!" onerror="this.style.display='none'; alert('축하합니다! 모두 클리어하셨습니다.')">
      <div style="position:absolute; bottom:15%; font-size:16px; color:#666; background:rgba(255,255,255,0.8); padding:5px 15px; border-radius:20px;">화면을 클릭하여 돌아가기</div>
    </div>
  `);
  finalLayer.click(function() {
    $(this).fadeOut(300, function() { $(this).remove(); });
  });
  $("body").append(finalLayer);
}

function toggleImageZoom(src) {
  if (imageZoomOverlay) {
    imageZoomOverlay.remove();
    imageZoomOverlay = null;
  }

  imageZoomOverlay = $(`
    <div id="image-zoom-overlay"
         style="position:fixed;inset:0;background:rgba(0,0,0,0.95);
         z-index:20000;display:flex;justify-content:center;
         align-items:center;cursor:zoom-out;padding:10px;">
      <img src="${src}" style="max-width:100%;max-height:100%;object-fit:contain;">
    </div>
  `);

  imageZoomOverlay.on("click", closeImageZoom);
  $("body").append(imageZoomOverlay);
}

function closeImageZoom() {
  if (imageZoomOverlay) {
    imageZoomOverlay.remove();
    imageZoomOverlay = null;
  }
}

$(document).on("keydown", function (e) {
  if (e.key === "Escape") closeImageZoom();
});

function toggleHint(n) {
  hintUsage[currentStage] = Math.max(hintUsage[currentStage] || 0, n);
  updateStatusBar();
  renderStageButtons();
  loadPuzzle(currentStage);
  syncProgressWithDB(true);
}

function selectStage(s) {
  currentStage = s;
  visitedStages.add(s);
  loadPuzzle(s);
  renderStageButtons();
  syncProgressWithDB(true);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$(document).ready(() => {
  // 10분 자동 로그인 체크
  if (!checkAutoLogin()) {
    $("#name-overlay").show();
    $("#main-game").hide();
  }
  updateStatusBar();
  renderStageButtons();
  selectStage(1);
});
</script>

</body>

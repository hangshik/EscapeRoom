<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>파이축제</title>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<style>
:root {
  --active: #007bff;
  --success: #28a745;
  --danger: #dc3545;
  --hint: #17a2b8;
  --bg: #f0f2f5;
  --card-bg: #ffffff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  margin: 0;
  padding: 15px 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

.container-fixed {
  width: 100%;
  max-width: 800px;
  background: var(--card-bg);
  border-radius: 20px;
  padding: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  margin-bottom: 20px;
  border: 3px solid transparent; 
  transition: border-color 0.3s ease;
}

.container-fixed.team-cia { border-color: var(--active); }
.container-fixed.team-mafia { border-color: var(--danger); }

h1 { 
  margin: 0 0 20px; 
  font-size: clamp(20px, 5vw, 32px); 
  text-align: center; 
  font-weight: 800; 
}

.quiz-question {
  font-size: clamp(18px, 4vw, 28px);
  font-weight: 700;
  text-align: center;
  margin-bottom: 15px;
  color: #444;
  word-break: keep-all;
}

.stage-button-container {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 8px;
  width: 100%;
}

.stage-button {
  width: 100%;
  padding: 12px 2px;
  border-radius: 10px;
  border: 1px solid #e9ecef;
  background: #f8f9fa;
  font-size: clamp(11px, 2.3vw, 16px);
  font-weight: 700;
  cursor: pointer;
  transition: 0.2s;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stage-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  background: #e9ecef;
}

.stage-button.active { background: var(--active); color: #fff; border-color: var(--active); }
.stage-button.stage-success { background: var(--success); color: #fff; border-color: var(--success); }

.status-bar { 
  display: flex; 
  justify-content: flex-end; 
  align-items: center;
  margin-top: 15px; 
  gap: 8px; 
  flex-wrap: wrap;
}

.badge { 
  padding: 6px 12px; 
  border-radius: 20px; 
  font-size: clamp(12px, 3vw, 16px); 
  font-weight: 700; 
  border: 1px solid; 
}
.wrong-badge { background: #fff5f5; color: var(--danger); border-color: #ffe3e3; }
.hint-badge { background: #e7faff; color: var(--hint); border-color: #bee5eb; display: none; }

.btn-reset {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: clamp(12px, 3vw, 16px);
  font-weight: 700;
  background: #fff;
  color: var(--danger);
  border: 2px solid var(--danger);
  cursor: pointer;
  transition: 0.2s;
}
.btn-reset:hover {
  background: #fff5f5;
}

.quiz-image { 
  width: 100%; 
  max-height: 50vh; 
  border-radius: 12px; 
  display: block; 
  margin: 0 auto; 
  cursor: pointer;
  background: #eee;
  object-fit: contain;
}

.input-group { 
  margin: 20px 0; 
  display: flex; 
  justify-content: center; 
  gap: 10px; 
}
#answer { 
  flex: 1; 
  max-width: 180px; 
  font-size: 18px;
  padding: 12px; 
  border-radius: 12px; 
  border: 2px solid #dee2e6; 
  text-align: center; 
  appearance: none;
}

.btn-submit {
  padding: 12px 24px; 
  border-radius: 12px; 
  background: var(--active);
  color: #fff; 
  border: none; 
  font-size: 18px; 
  font-weight: 700; 
  cursor: pointer;
}

.btn-hint {
  padding: 14px 28px; 
  border-radius: 30px; 
  border: none;
  background: linear-gradient(135deg, #17a2b8, #117a8b);
  color: #fff;
  font-size: 16px; 
  font-weight: 700;
  box-shadow: 0 4px 15px rgba(23, 162, 184, 0.3);
  cursor: pointer;
  transition: 0.3s;
}
.btn-hint.enabled { 
  background: linear-gradient(135deg, #28a745, #1e7e34); 
  box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
}
.btn-hint:active {
  transform: scale(0.98);
}

.hint-content {
  background: #f8f9fa; 
  padding: 15px; 
  border-radius: 12px;
  margin-top: 15px; 
  font-size: 16px; 
  border-left: 4px solid var(--hint);
  line-height: 1.5;
  text-align: center;
}

.team-select-group {
  display: flex;
  gap: 20px;
  justify-content: center;
  margin: 30px 0;
}
.team-select-group label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 20px;
  font-weight: bold;
  cursor: pointer;
  padding: 15px 25px;
  border: 2px solid #dee2e6;
  border-radius: 12px;
  transition: 0.2s;
}
.team-select-group input[type="radio"] {
  transform: scale(1.5);
  cursor: pointer;
}

.team-select-group label:has(input[value="CIA"]:checked) {
  border-color: var(--active);
  background: #e7f1ff;
  color: var(--active);
}

.team-select-group label:has(input[value="MAFIA"]:checked) {
  border-color: var(--danger);
  background: #fff5f5;
  color: var(--danger);
}

.success-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px); display: flex; justify-content: center; align-items: center; z-index: 10000;
  padding: 20px;
}
.success-modal { 
  background: #fff; 
  padding: 30px; 
  border-radius: 20px; 
  text-align: center; 
  width: 100%; 
  max-width: 350px; 
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.hint-modal-input {
  width: 100%;
  padding: 12px;
  font-size: 20px;
  letter-spacing: 4px;
  text-align: center;
  border: 2px solid #dee2e6;
  border-radius: 12px;
  margin: 15px 0;
}

#final-success {
  position: fixed; inset: 0; background: #fff; z-index: 11000;
  display: flex; justify-content: center; align-items: center; cursor: pointer;
}
#final-success img { width: 100%; height: 100%; object-fit: contain; }

@media (min-width: 800px) {
  .container-fixed { padding: 35px; }
  .stage-button { padding: 18px 5px; font-size: 18px; }
  #answer { font-size: 24px; max-width: 250px; }
  .btn-submit { font-size: 22px; }
}
</style>
</head>
<body>

<div class="container-fixed">
  <h1>파이축제가 끝나기 전에 다이아몬드를 찾아라!</h1>
  <div id="stage-buttons" class="stage-button-container"></div>
  <div class="status-bar">
    <button class="btn-reset" onclick="promptReset()">기록 초기화</button>
    <div id="hint-count-badge" class="badge hint-badge">힌트 횟수: <span id="total-hint-count">0</span></div>
    <div class="badge wrong-badge">오답 횟수: <span id="wrong-count">0</span></div>
  </div>
</div>

<div id="puzzle" class="container-fixed"></div>

<script>
document.addEventListener("contextmenu", e => e.preventDefault());

const puzzleData = [
  { stage: 1, isTeamSelect: true, question: "CIA팀과 MAFIA팀 여러분 환영합니다.!!!<br>지금부터 다이아몬드를 찾는 여정을 시작하겠습니다.<br>소속 팀을 선택해주세요.", image: "cm0.jpg" },
  { 
    stage: 2, 
    CIA: { question: "다이아몬드의 이름을 입력하세요.", image: "c1.jpg", answer: ["REGENT","regent"], inputType: "text", hintImage: "cia_h1.png" },
    MAFIA: { question: "다이아몬드의 이름을 입력하세요.", image: "m1.jpg", answer: ["REGENT","regent"], inputType: "text", hintImage: "mafia_h1.png" }
  },
  { 
    stage: 3, 
    CIA: { question: "지배자의 이름을 입력하세요.", image: "c2.jpg", answer: "나폴레옹", inputType: "text", hintImage: "cia_h2.png" },
    MAFIA: { question: "지배자의 이름을 입력하세요.", image: "m2.jpg", answer: "루이16세", inputType: "text", hintImage: "mafia_h2.png" }
  },
  { 
    stage: 4, 
    CIA: { question: "비행기 번호를 입력하세요.", image: "c3.jpg", answer: ["T5M84","t5m84"], inputType: "text", hintImage: "cia_h3.png" },
    MAFIA: { question: "배 번호를 입력하세요.", image: "m3.jpg", answer: ["J3K79","j3k79"], inputType: "text", hintImage: "mafia_h3.png" }
  },
  { 
    stage: 5, 
    CIA: { question: "모두 성공했다면 선생님에게 말하세요.", image: "c4.jpg", answer: "314", inputType: "number", hintImage: "cia_h4.png" },
    MAFIA: { question: "모두 성공했다면 선생님에게 말하세요.", image: "m4.jpg", answer: "314", inputType: "number", hintImage: "mafia_h4.png" }
  },
  { 
    stage: 6, 
    CIA: { question: "박물관 입구의 방향을 입력하세요.", image: "c5.jpg", answer: ["WEST","west"], inputType: "text", hintImage: "cia_h5.png" },
    MAFIA: { question: "박물관 입구의 방향을 입력하세요.", image: "m5.jpg", answer: ["EAST","east"], inputType: "text", hintImage: "mafia_h5.png" }
  },
  { 
    stage: 7, 
    CIA: { question: "함정을 피하기 위한 방향키를 입력하세요.<br>(오른쪽 = R, 왼쪽=L, 위쪽=U, 아래쪽=D)", image: "c6.jpg", answer: ["RDRDLU","rdrdlu"], inputType: "text", hintImage: "cia_h6.png" },
    MAFIA: { question: "함정을 피하기 위한 방향키를 입력하세요.<br>(오른쪽 = R, 왼쪽=L, 위쪽=U, 아래쪽=D)", image: "m6.jpg", answer: ["DRDRUL","drdrul"], inputType: "text", hintImage: "mafia_h6.png" }
  },
  { 
    stage: 8, 
    CIA: { question: "하인의 저주를 풀기 위한 암호를 입력하세요.", image: "c7.jpg", answer: "22501205", inputType: "number", hintImage: "cia_h7.png" },
    MAFIA: { question: "하인의 저주를 풀기 위한 암호를 입력하세요.", image: "m7.jpg", answer: "22801223", inputType: "number", hintImage: "mafia_h7.png" }
  },
  { 
    stage: 9, 
    CIA: { question: "다이아몬드 상자를 열기 위한 마지막 암호문을 입력하시오.", image: "c8.jpg", answer: ["UWIN","uwin"], inputType: "text", hintImage: "cia_h8.png" },
    MAFIA: { question: "다이아몬드 상자를 열기 위한 마지막 암호문을 입력하시오.", image: "m8.jpg", answer: ["WINNER","winner"], inputType: "text", hintImage: "mafia_h8.png" }
  },
  { 
    stage: 10, 
    isEnding: true, 
    question: "우리가 먼저 다이아몬드를 찾았다. <br>드디어 다이아몬드를 손에 넣었어!!!!", 
    image: "cm10.png"
  }
];

let selectedTeam = localStorage.getItem("selectedTeam") || null;
let maxUnlockedStage = parseInt(localStorage.getItem("maxUnlockedStage")) || 1;
let currentStage = parseInt(localStorage.getItem("currentStage")) || 1;
let totalWrongCount = parseInt(localStorage.getItem("totalWrongCount")) || 0;

let clearedStages = new Set(JSON.parse(localStorage.getItem("clearedStages")) || []);
let hintUsage = JSON.parse(localStorage.getItem("hintUsage")) || {};
let stageState = JSON.parse(localStorage.getItem("stageState")) || {};

let imageZoomOverlay = null;

function saveToLocalStorage() {
  localStorage.setItem("selectedTeam", selectedTeam || "");
  localStorage.setItem("maxUnlockedStage", maxUnlockedStage);
  localStorage.setItem("currentStage", currentStage);
  localStorage.setItem("totalWrongCount", totalWrongCount);
  localStorage.setItem("clearedStages", JSON.stringify(Array.from(clearedStages)));
  localStorage.setItem("hintUsage", JSON.stringify(hintUsage));
  localStorage.setItem("stageState", JSON.stringify(stageState));
}

function updateStatusBar() {
  const totalHints = Object.values(hintUsage).filter(v => v).length;
  if (totalHints > 0) {
    $("#hint-count-badge").css("display", "inline-block");
    $("#total-hint-count").text(totalHints);
  } else {
    $("#hint-count-badge").hide();
  }
  $("#wrong-count").text(totalWrongCount);
}

function updateTeamBorders() {
  $(".container-fixed").removeClass("team-cia team-mafia");
  if (selectedTeam === "CIA") {
    $(".container-fixed").addClass("team-cia");
  } else if (selectedTeam === "MAFIA") {
    $(".container-fixed").addClass("team-mafia");
  }
}

function renderStageButtons() {
  const c = $("#stage-buttons").empty();
  puzzleData.forEach(p => {
    const isUnlocked = p.stage <= maxUnlockedStage;
    let cls = "stage-button";
    
    if (p.stage === currentStage) cls += " active";
    else if (clearedStages.has(p.stage)) cls += " stage-success";

    let buttonName = "";
    if (p.stage === 1) buttonName = "팀선택";
    else if (p.stage === 10) buttonName = "성공";
    else buttonName = `${p.stage - 1}단계`; 

    c.append(`<button class="${cls}" ${isUnlocked ? `onclick="selectStage(${p.stage})"` : "disabled"}>${buttonName}</button>`);
  });
}

function loadPuzzle(stage) {
  const data = puzzleData.find(x => x.stage === stage);
  
  if (data.isTeamSelect) {
    $("#puzzle").html(`
      <div class="quiz-question">${data.question}</div>
      <img src="${data.image}" class="quiz-image" onclick="toggleImageZoom(this.src)" onerror="this.alt='1단계 이미지 없음 (${data.image})'">
      <div class="team-select-group">
        <label><input type="radio" name="team" value="CIA" ${selectedTeam === 'CIA' ? 'checked' : ''}> CIA팀</label>
        <label><input type="radio" name="team" value="MAFIA" ${selectedTeam === 'MAFIA' ? 'checked' : ''}> MAFIA팀</label>
      </div>
      <div class="input-group">
        <button class="btn-submit" onclick="confirmTeam()">결정</button>
      </div>
    `);
    return;
  }

  if (data.isEnding) {
    $("#puzzle").html(`
      <div class="quiz-question">${data.question}</div>
      <img src="${data.image}" class="quiz-image" onclick="toggleImageZoom(this.src)" onerror="this.alt='이미지 없음 (${data.image})'">
    `);
    return;
  }

  const teamData = data[selectedTeam];
  const saved = stageState[stage] || {};
  const isHintUnlocked = hintUsage[stage];
  const totalHints = Object.values(hintUsage).filter(v => v).length;
  
// 버튼 텍스트를 단순화하여 항상 "힌트 보기"로 표시
let hintBtnText = "힌트 보기";

let hintHtml = `<div style="border-top:1.5px solid #eee; padding-top:20px; margin-top:15px; text-align:center;">
                  <button class="btn-hint ${isHintUnlocked ? "enabled" : ""}" onclick="openHintModal()">
                    ${hintBtnText}
                  </button>
                </div>`;
  
  if (isHintUnlocked) {
    hintHtml += `<div class="hint-content">
                  <img src="${teamData.hintImage}" class="quiz-image" style="min-height:auto;" onclick="toggleImageZoom(this.src)" onerror="this.alt='힌트 이미지 없음 (${teamData.hintImage})'">
                 </div>`;
  }

  $("#puzzle").html(`
    <div class="quiz-question">${teamData.question}</div>
    <img src="${teamData.image}" class="quiz-image" onclick="toggleImageZoom(this.src)" onerror="this.alt='이미지 없음 (${teamData.image})'">
    <div class="input-group">
      <input id="answer" type="${teamData.inputType}" value="${saved.answer || ""}" placeholder="정답" onkeypress="if(event.keyCode==13) checkAnswer()">
      <button class="btn-submit" onclick="checkAnswer()">확인</button>
    </div>
    ${hintHtml}
  `);
}

function confirmTeam() {
  const team = $("input[name='team']:checked").val();
  if (!team) {
    alert("팀을 먼저 선택해주세요.");
    return;
  }
  selectedTeam = team;
  clearedStages.add(1);
  maxUnlockedStage = Math.max(maxUnlockedStage, 2);
  saveToLocalStorage();
  updateTeamBorders(); 
  renderStageButtons();
  nextAction();
}

function openHintModal() {
  if (hintUsage[currentStage]) return;
  
  const totalHints = Object.values(hintUsage).filter(v => v).length;

  // 3회까지는 즉시 해금 (확인창 없음)
  if (totalHints < 3) {
    hintUsage[currentStage] = true;
    saveToLocalStorage();
    updateStatusBar();
    loadPuzzle(currentStage);
    return;
  }

  // 4번째부터는 암호 입력 모달
  const modal = $(`
    <div class="success-overlay" id="hintModalOverlay">
      <div class="success-modal" style="border-top: 5px solid var(--hint);">
        <h2 style="color:var(--hint); margin-top:0;">🔒 힌트 암호 입력</h2>
        <p style="font-size:15px; margin-bottom: 20px;">추가 힌트를 보려면 암호를 입력하세요.</p>
        <input type="password" id="hintPasswordInput" class="hint-modal-input" maxlength="4" placeholder="••••" autofocus>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button id="hintCancelBtn" class="btn-submit" style="background:#6c757d; flex:1; font-size:16px; padding:10px;">취소</button>
          <button id="hintConfirmBtn" class="btn-submit" style="background:var(--hint); flex:1; font-size:16px; padding:10px;">확인</button>
        </div>
      </div>
    </div>
  `);
  $("body").append(modal);
  $("#hintPasswordInput").focus();

  const closeHintModal = () => $("#hintModalOverlay").remove();

  const submitHintPassword = () => {
    const inputPw = $("#hintPasswordInput").val();
    
    if (inputPw === "3141") {  // 3141 고정 비밀번호 검증
      hintUsage[currentStage] = true;
      saveToLocalStorage();
      updateStatusBar();
      closeHintModal();
      loadPuzzle(currentStage);
    } else {
      alert("비밀번호가 틀렸습니다!");
      $("#hintPasswordInput").val("").focus();
    }
  };

  $("#hintCancelBtn").click(closeHintModal);
  $("#hintConfirmBtn").click(submitHintPassword);
  $("#hintPasswordInput").on("keypress", function(e) {
    if(e.keyCode === 13) submitHintPassword();
  });
}

function checkAnswer() {
  const data = puzzleData.find(x => x.stage === currentStage);
  const teamData = data[selectedTeam];
  const v = $("#answer").val().trim();
  
  const ok = Array.isArray(teamData.answer) ? teamData.answer.includes(v) : v === teamData.answer;

  if (ok) {
    stageState[currentStage] = { answer: v, result: "정답!" };
    clearedStages.add(currentStage);
    maxUnlockedStage = Math.max(maxUnlockedStage, currentStage + 1);
    saveToLocalStorage();
    renderStageButtons();
    showSuccess();
  } else {
    totalWrongCount++;
    saveToLocalStorage();
    updateStatusBar();
    showFailure();
  }
}

function showFailure() {
  const modal = $(`
    <div class="success-overlay" id="failureOverlay">
      <div class="success-modal" style="border-top: 5px solid var(--danger);">
        <h2 style="color:var(--danger); margin-top:0;">❌ 틀렸습니다!</h2>
        <p style="font-size:18px;">다시 한번 생각해보세요.</p>
        <button id="modalCloseBtn" class="btn-submit" style="width:100%; margin-top:20px; background:var(--danger);">다시 시도</button>
      </div>
    </div>
  `);
  $("body").append(modal);

  const closeModal = () => {
    $("#failureOverlay").remove();
    $(document).off("keydown", handleFailureEnter);
    $("#answer").focus().select();
  };

  const handleFailureEnter = (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      closeModal();
    }
  };

  $(document).on("keydown", handleFailureEnter);
  $("#modalCloseBtn").click(closeModal);
}

function showSuccess() {
  const modal = $(`
    <div class="success-overlay">
      <div class="success-modal" style="border-top: 5px solid var(--success);">
        <h2 style="color:var(--success); margin-top:0;">🎉 정답!</h2>
        <p style="font-size:18px;">참 잘하셨습니다!</p>
        <button id="modalNextBtn" class="btn-submit" style="width:100%; margin-top:20px; background:var(--success);">다음 단계로</button>
      </div>
    </div>
  `);
  $("body").append(modal);

  const closeAndNext = () => {
    $(".success-overlay").remove();
    nextAction();
    $(document).off("keydown", handleEnter);
  };

  const handleEnter = (e) => { if (e.key === "Enter") closeAndNext(); };
  $(document).on("keydown", handleEnter);
  $("#modalNextBtn").click(closeAndNext);
}

function nextAction() {
  if (clearedStages.size === puzzleData.length - 1) { 
    selectStage(10); 
    return;
  }
  let nextStage = -1;
  for (let i = currentStage + 1; i <= puzzleData.length; i++) {
    if (!clearedStages.has(i)) { nextStage = i; break; }
  }
  if (nextStage !== -1) selectStage(nextStage);
}

function promptReset() {
  const modal = $(`
    <div class="success-overlay" id="resetModalOverlay">
      <div class="success-modal" style="border-top: 5px solid var(--danger);">
        <h2 style="color:var(--danger); margin-top:0;">⚠️ 기록 초기화</h2>
        <p style="font-size:16px;">정말로 모든 진행 기록과 통계를 초기화하고<br>처음부터 다시 시작하시겠습니까?</p>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button id="resetCancelBtn" class="btn-submit" style="background:#6c757d; flex:1; font-size:16px; padding:10px;">취소</button>
          <button id="resetConfirmBtn" class="btn-submit" style="background:var(--danger); flex:1; font-size:16px; padding:10px;">초기화</button>
        </div>
      </div>
    </div>
  `);
  $("body").append(modal);

  $("#resetCancelBtn").click(() => $("#resetModalOverlay").remove());
  $("#resetConfirmBtn").click(() => {
    $("#resetModalOverlay").remove();
    executeReset();
  });
}

function executeReset() {
  localStorage.clear();
  selectedTeam = null;
  maxUnlockedStage = 1;
  currentStage = 1;
  totalWrongCount = 0;
  clearedStages.clear();
  hintUsage = {};
  stageState = {};
  
  saveToLocalStorage();
  updateStatusBar();
  updateTeamBorders();  
  renderStageButtons();
  selectStage(1);
}

function toggleImageZoom(src) {
  if (imageZoomOverlay) {
    imageZoomOverlay.remove();
    imageZoomOverlay = null;
  }

  imageZoomOverlay = $(`
    <div id="image-zoom-overlay"
         style="position:fixed;inset:0;background:rgba(0,0,0,0.95);
         z-index:20000;display:flex;justify-content:center;
         align-items:center;cursor:zoom-out;padding:10px;">
      <img src="${src}" style="max-width:100%;max-height:100%;object-fit:contain;">
    </div>
  `);

  imageZoomOverlay.on("click", closeImageZoom);
  $("body").append(imageZoomOverlay);
}

function closeImageZoom() {
  if (imageZoomOverlay) {
    imageZoomOverlay.remove();
    imageZoomOverlay = null;
  }
}

$(document).on("keydown", function (e) {
  if (e.key === "Escape") closeImageZoom();
});

function selectStage(s) {
  if (s > maxUnlockedStage) return; 
  currentStage = s;
  saveToLocalStorage(); 
  loadPuzzle(s);
  renderStageButtons();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

$(document).ready(() => {
  updateTeamBorders();
  updateStatusBar();
  renderStageButtons();
  loadPuzzle(currentStage);
});
</script>

</body>
